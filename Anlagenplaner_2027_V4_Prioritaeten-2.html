<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anlagenplaner 2027</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#1c2936;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}header{background:#18314b;color:white;padding:17px 18px}header h1{margin:0;font-size:22px}header small{opacity:.85}main{max-width:1250px;margin:auto;padding:15px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}button,.button{border:1px solid #c8d1dc;background:white;border-radius:9px;padding:10px 12px;font:inherit;cursor:pointer}button.active,.primary{background:#1b5d98;color:white;border-color:#1b5d98}button:disabled{opacity:.4;cursor:not-allowed}.panel{background:white;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px #0001}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}input,select{padding:9px;border:1px solid #bbc7d4;border-radius:8px;font:inherit;max-width:100%}input[type=date]{width:165px}.muted{color:#657586}.warn{background:#fff2d7;padding:10px;border-radius:8px}.ok{background:#e4f6e8;padding:10px;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.metric{background:#edf3f9;border-radius:10px;padding:12px}.metric b{font-size:24px}.tablewrap{overflow:auto;max-height:70vh}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{border:1px solid #dce3eb;padding:7px;text-align:center}th{background:#e8eef6;position:sticky;top:0;z-index:1}td:first-child,th:first-child{text-align:left;position:sticky;left:0;background:#fff;z-index:2}th:first-child{background:#dfe9f4;z-index:3}.F{background:#d4efdb}.N{background:#c8ddfa}.S{background:#f8d0d0}.M{background:#fff0ad}.NA{background:#f2c5df}.missing{background:#ffe0b3}.small{font-size:12px}.prio{display:flex;align-items:center;gap:8px;border-bottom:1px solid #e5e9ef;padding:7px 0}.prio span{flex:1}footer{font-size:12px;color:#697988;padding:12px}h2{font-size:19px;margin:0 0 12px}h3{font-size:16px}label{font-size:14px} .pill{border-radius:20px;padding:3px 9px;background:#e8eef5}.scroll{overflow:auto} @media(max-width:550px){main{padding:8px}.panel{padding:12px}button{padding:9px}header{padding:13px}table{font-size:11px}th,td{padding:5px}}
</style></head><body><header><h1>Anlagenplaner 2027</h1><small>11 Mitarbeiter · 14-Tage-Blöcke · 7 Tage frei · lokale Speicherung</small></header><main><div id="tabs" class="tabs"></div><div id="app"></div><footer>Einzelbenutzer-Version · Daten bleiben in diesem Browser. Bitte regelmäßig eine JSON-Sicherung herunterladen. Keine Server-Synchronisierung.</footer></main><script>
'use strict';
const KEY='anlagenplaner-2027-v4-prioritaet',people=['Auerbach','Becker','Brandl','Böhm','Kaspar','Liepelt','Schwaiger','Shebalin','Sigl','Strasser','Zepmeisel'];
const plantNames={W:'Konti / Warte',L:'Labor',A:'Abfüllung',B3:'Batch 3',K:'Koruma',AS:'AS-Batch 1 + MRW',E:'Ekato',I:'Indag',EG:'Ela-Gel'};
const defaultPriority=['W','L','A','B3','K','AS','E','I','EG'];
const shiftSeq=['M','M','N','N','N','F','F','F','S','S','S','F','M','M','N','N','F','F','F','S','S','S','F','M','M','M','N','N','F','F','F','F','F','F','F'];
const MS=86400000;const iso=d=>new Date(d).toISOString().slice(0,10);const parse=s=>new Date(s+'T12:00:00Z');const add=(s,n)=>iso(new Date(parse(s).getTime()+n*MS));const diff=(a,b)=>Math.round((parse(a)-parse(b))/MS);const mod=(n,m)=>(n%m+m)%m;const html=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults=()=>({anchor:'2027-01-06',priority:[...defaultPriority],absences:{},locks:{},selected:'2027-01-06'});
let state;try{state={...defaults(),...JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('anlagenplaner-2027-v3-start-0601')||'{}')}}catch(e){state=defaults()};let tab='plan',computed=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state));computed=null;render()}
function blockInfo(d){let k=Math.floor(diff(d,state.anchor)/35),pos=mod(diff(d,state.anchor),35);return {cycle:k,pos,block:pos<14?0:pos<28?1:-1,start:add(state.anchor,k*35+(pos<14?0:14)),label:pos<14?'Block 1':pos<28?'Block 2':'7 Tage frei'}}
function shift(d){return shiftSeq[mod(diff(d,state.anchor),35)]}
function hours(d){let s=shift(d);return s==='F'?0:parse(d).getUTCDay()===0?12:8}
function blockStarts(){let a=[];for(let i=-5;i<35;i++){for(let offset of [0,14]){let start=add(state.anchor,i*35+offset);if(start<='2027-12-31'&&add(start,13)>='2026-11-01')a.push(start)}}return a.sort()}
function shortDate(d){return parse(d).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'UTC'})}
function dayName(d){return ['So','Mo','Di','Mi','Do','Fr','Sa'][parse(d).getUTCDay()]}
function getAbsent(d){return state.absences[d]||[]}
function countAssignments(block, stats){let dates=Array.from({length:14},(_,i)=>add(block,i));let available=people.filter(p=>p!=='Schwaiger');let presentDays=Object.fromEntries(people.map(p=>[p,dates.filter(d=>shift(d)!=='F'&&!getAbsent(d).includes(p))]));let targetHours=Object.fromEntries(people.map(p=>[p,presentDays[p].reduce((s,d)=>s+hours(d),0)]));let used=new Set();let result={};let slots=['W','W','L','A','B3','K','AS','E','I','EG'];let order=slots.map((s,i)=>({s,i}));
// Assign each available person a stable primary position. Minimize recent repeats, balance hours by plant, prefer distributing W fairly.
let candidates=[];for(let p of available){let a=[];for(let slot of order){let prior=(stats.history[p]||[]).slice(-4);let repeat=prior.includes(slot.s);let historical=(stats.hours[p]?.[slot.s]||0);let mean=Object.values(stats.hours).reduce((sum,h)=>sum+(h[slot.s]||0),0)/10;let score=(repeat?9000:0)+(historical-mean)*1.6+(stats.blocks[p]?.[slot.s]||0)*10+(slot.s==='W'?((stats.hours[p]?.W||0)*.25):0)+slot.i*.0001; a.push({slot,score})}a.sort((x,y)=>x.score-y.score);candidates.push({p,a})}
// Exact minimum-cost assignment by DP over 2^10 slot masks.
let dp=new Map([[0,{cost:0,arr:[]}]]);for(let item of candidates){let next=new Map();for(let [mask,rec] of dp){for(let c of item.a){let bit=1<<c.slot.i;if(mask&bit)continue;let key=mask|bit,v=rec.cost+c.score;let old=next.get(key);if(!old||v<old.cost)next.set(key,{cost:v,arr:[...rec.arr,c.slot.s]})}}dp=next}
let best=dp.get(1023);available.forEach((p,i)=>result[p]=best.arr[i]);result.Schwaiger='SF';
let daily={};let totals={};let shortages=[];let exceptions=[];
for(let d of dates){let s=shift(d);if(s==='F'){daily[d]={shift:s,hours:0,assign:{}};continue}let absent=getAbsent(d);let assign={};for(let p of people){if(!absent.includes(p))assign[p]=result[p]}
if(absent.includes('Schwaiger')&&!absent.includes('Becker'))assign.Becker='SF';
if(!absent.includes('Schwaiger'))assign.Schwaiger='SF';
// Fill priority slots first, preserving assignments wherever possible.
// If a high-priority post is absent, move a person from the lowest-priority
// occupied post, leaving that lower-priority post vacant.
let active=Object.keys(assign).filter(p=>assign[p]!=='SF');
let needs=state.priority.flatMap(plant=>plant==='W'?['W','W']:[plant]);
let assigned={},unassigned=[...active];
for(let target of needs){
  let exact=unassigned.find(p=>assign[p]===target);
  if(exact!==undefined){
    assigned[exact]=target;
    unassigned=unassigned.filter(p=>p!==exact);
  } else {
    // Reserve staff for the most important posts. Prefer an otherwise spare
    // worker; otherwise reallocate from the lowest-priority original plant.
    let rank=p=>state.priority.indexOf(assign[p]);
    let donor=[...unassigned].sort((x,y)=>
      (assign[y]==='S'?99:rank(y))-(assign[x]==='S'?99:rank(x))
    )[0];
    if(donor!==undefined){
      assigned[donor]=target;
      unassigned=unassigned.filter(p=>p!==donor);
      if(assign[donor]!==target)exceptions.push({date:d,person:donor,from:assign[donor],to:target});
    } else shortages.push({date:d,plant:target});
  }
}
for(let p of unassigned)assigned[p]='S';
for(let p of Object.keys(assign))if(assign[p]==='SF')assigned[p]='SF';
daily[d]={shift:s,hours:hours(d),assign:assigned,absent};for(let [p,plant] of Object.entries(assigned)){if(!totals[p])totals[p]={};totals[p][plant]=(totals[p][plant]||0)+hours(d)}
}
return {start:block,end:add(block,13),base:result,daily,totals,shortages,exceptions,dates,workHours:dates.reduce((v,d)=>v+hours(d),0)}
}
function calculate(){if(computed)return computed;let blocks=blockStarts(),stats={hours:Object.fromEntries(people.map(p=>[p,{}])),history:Object.fromEntries(people.map(p=>[p,[]])),blocks:Object.fromEntries(people.map(p=>[p,{}]))};let result=[];for(let b of blocks){let saved=state.locks[b];let r=countAssignments(b,stats);if(saved){r=saved;r.locked=true}result.push(r);for(let p of people){let primary=r.base[p];if(primary&&primary!=='SF'&&primary!=='S'){stats.history[p].push(primary);stats.blocks[p][primary]=(stats.blocks[p][primary]||0)+1}for(let [plant,h] of Object.entries(r.totals[p]||{}))if(r.start>='2027-01-01')stats.hours[p][plant]=(stats.hours[p][plant]||0)+h}}return computed={blocks:result,stats}}
function button(label,fn,cls=''){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function nav(){document.getElementById('tabs').innerHTML=[['plan','Blockplanung'],['absence','Abwesenheiten'],['priority','Prioritäten'],['stats','Fairness'],['settings','Einstellungen']].map(([k,v])=>`<button class="${tab===k?'active':''}" onclick="switchTab('${k}')">${v}</button>`).join('')}
function switchTab(t){tab=t;render()}
function render(){nav();let root=document.getElementById('app');try{root.innerHTML=({plan:planView,absence:absenceView,priority:priorityView,stats:statsView,settings:settingsView})[tab]()}catch(e){root.innerHTML=`<div class="panel warn">Fehler bei der Berechnung: ${html(e.message)}</div>`;console.error(e)}}
function planView(){let all=calculate().blocks.filter(b=>b.start<='2027-12-31'&&b.end>='2027-01-01');let selected=all.find(b=>b.start===state.selected)||all[0];if(!selected)return '<div class="panel">Keine Blöcke gefunden.</div>';let info=blockInfo(selected.start);let alerts=selected.shortages.length;let lock=!!state.locks[selected.start];let h=`<div class="panel"><div class="row between"><h2>Blockplanung</h2><span class="pill">${all.length} Blöcke mit Tagen in 2027</span></div><div class="row"><label>Block <select onchange="chooseBlock(this.value)">${all.map(b=>`<option value="${b.start}" ${b.start===selected.start?'selected':''}>${shortDate(b.start)} – ${shortDate(b.end)} (${blockInfo(b.start).label})</option>`).join('')}</select></label>${button('CSV exportieren','exportBlock()')}${button(lock?'Freigabe aufheben':'Block freigeben',lock?'unlockBlock()':'lockBlock()',lock?'':'primary')}</div><p class="${alerts?'warn':'ok'}">${lock?'🔒 Freigegeben · ':''}${alerts?`${alerts} unbesetzte Anlagenplätze auf Arbeitstagen`:'Alle Anlagenplätze bei Anwesenheit besetzt'} · ${selected.exceptions.length} Tagesvertretungen</p><p class="muted small">Einmal festgelegte Anlagen bleiben über den Block möglichst konstant. An NA-Tagen werden freie Plätze nach Priorität besetzt. Freigaben bleiben bei späteren Änderungen erhalten.</p></div>`;
h+=`<div class="panel tablewrap"><table><thead><tr><th>Mitarbeiter</th><th>Grundposition</th>${selected.dates.map(d=>`<th>${dayName(d)}<br>${d.slice(8)}<br>${{M:'Früh',N:'Nacht',S:'Spät',F:'Frei'}[shift(d)]}</th>`).join('')}</tr></thead><tbody>${people.map(p=>`<tr><td>${p}</td><td><b>${selected.base[p]}</b></td>${selected.dates.map(d=>{let entry=selected.daily[d];let v=entry.shift==='F'?'Frei':getAbsent(d).includes(p)?'NA':entry.assign[p]||'–';return `<td class="${v==='NA'?'NA':entry.shift==='F'?'F':entry.shift}">${v}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
if(alerts)h+=`<div class="panel"><h3>Unbesetzte Anlagen</h3>${selected.shortages.map(x=>`<div>${shortDate(x.date)}: ${plantNames[x.plant]}</div>`).join('')}</div>`;return h}
function chooseBlock(v){state.selected=v;save()}
function absenceView(){let entries=Object.entries(state.absences).flatMap(([d,p])=>p.map(n=>({d,n}))).sort((a,b)=>a.d.localeCompare(b.d));return `<div class="panel"><h2>Abwesenheit eintragen</h2><div class="row"><label>Mitarbeiter<br><select id="absencePerson">${people.map(p=>`<option>${p}</option>`).join('')}</select></label><label>Von<br><input type="date" id="absenceFrom" value="2027-01-01"></label><label>Bis<br><input type="date" id="absenceTo" value="2027-01-01"></label>${button('Abwesenheit speichern','addAbsence()','primary')}</div><p class="muted small">NA wird nur an tatsächlichen Arbeitstagen relevant. Einträge können auch an freien Tagen bestehen bleiben.</p></div><div class="panel"><h2>Gespeicherte Abwesenheiten (${entries.length} Tage)</h2><div class="scroll">${entries.length?`<table><tr><th>Datum</th><th>Mitarbeiter</th><th>Aktion</th></tr>${entries.map(x=>`<tr><td>${shortDate(x.d)}</td><td>${x.n}</td><td>${button('Entfernen',`removeAbsence('${x.d}','${x.n}')`)}</td></tr>`).join('')}</table>`:'Noch keine Abwesenheiten eingetragen.'}</div></div>`}
function addAbsence(){let p=document.getElementById('absencePerson').value,a=document.getElementById('absenceFrom').value,b=document.getElementById('absenceTo').value;if(!a||!b||a>b||diff(b,a)>366){alert('Bitte gültigen Zeitraum bis 366 Tage eingeben.');return}for(let d=a;d<=b;d=add(d,1)){let block=blockInfo(d);if(state.locks[block.start]){alert('Mindestens ein Tag liegt in einem freigegebenen Block. Bitte zuerst die Freigabe aufheben.');return}}for(let d=a;d<=b;d=add(d,1)){state.absences[d]??=[];if(!state.absences[d].includes(p))state.absences[d].push(p)}save()}
function removeAbsence(d,p){if(state.locks[blockInfo(d).start]){alert('Block ist freigegeben.');return}state.absences[d]=state.absences[d].filter(x=>x!==p);if(!state.absences[d].length)delete state.absences[d];save()}
function priorityView(){return `<div class="panel"><h2>Anlagenpriorität</h2><p class="muted">Änderungen gelten für die nächste Berechnung noch nicht freigegebener Blöcke. Die Warte benötigt immer zwei Mitarbeiter, unabhängig von ihrem Rang.</p>${state.priority.map((s,i)=>`<div class="prio"><b>${i+1}.</b><span>${plantNames[s]} ${s==='W'?'(2 Personen)':''}</span>${button('↑',`movePriority(${i},-1)`) }${button('↓',`movePriority(${i},1)`)}</div>`).join('')}</div>`}
function movePriority(i,dir){let j=i+dir;if(j<0||j>=state.priority.length)return;[state.priority[i],state.priority[j]]=[state.priority[j],state.priority[i]];save()}
function statsView(){let {stats,blocks}=calculate();let total=blocks.reduce((a,b)=>a+b.shortages.length,0);let plants=['W','L','A','B3','K','AS','E','I','EG','SF'];let vals=people.filter(p=>p!=='Schwaiger').flatMap(p=>plants.filter(s=>s!=='SF').map(s=>stats.hours[p][s]||0));let min=Math.min(...vals),max=Math.max(...vals);return `<div class="panel"><h2>Fairness 2027 – geplante Stunden</h2><div class="grid"><div class="metric">Spanne je Mitarbeiter/Anlage<br><b>${min}–${max} h</b></div><div class="metric">Unbesetzte Anlagenplätze<br><b>${total}</b></div><div class="metric">Wiederholungs-Sperre<br><b>4 Blöcke</b></div></div><p class="muted small">Stunden sind simuliert: 8 h je Arbeitstag, Sonntag 12 h. Die Jahresplanung ist ein Vorschlag; bestätigte tatsächliche Einsätze werden nicht separat erfasst. Historische Stunden 2026 zählen nicht.</p><div class="tablewrap"><table><tr><th>Mitarbeiter</th>${plants.map(s=>`<th>${s}</th>`).join('')}<th>Gesamt</th></tr>${people.map(p=>`<tr><td>${p}</td>${plants.map(s=>`<td>${stats.hours[p][s]||0}</td>`).join('')}<td><b>${Object.values(stats.hours[p]).reduce((a,b)=>a+b,0)}</b></td></tr>`).join('')}</table></div></div>`}
function settingsView(){let sample=['2027-02-12','2027-06-20','2027-10-18','2027-12-15'];return `<div class="panel"><h2>Schichtrhythmus</h2><p>Block 1: <b>FF NNN frei×3 SSS frei FF</b><br>Block 2: <b>NN frei×3 SSS frei FFF NN</b><br>Danach <b>7 Tage frei</b>; dann Wiederholung.</p><label>Erster Tag von Block 1 (Kalenderanker)<br><input type="date" value="${state.anchor}" onchange="changeAnchor(this.value)"></label><p class="warn">Der Kalenderanker ist auf den bestätigten 06.01.2027 eingestellt. Die ersten fünf Tage 2027 gehören zu den sieben freien Tagen des vorherigen Zyklus.</p><h3>Stichproben mit aktuellem Kalenderanker</h3>${sample.map(d=>`<div>${shortDate(d)}: <b>${{M:'Früh',N:'Nacht',S:'Spät',F:'Frei'}[shift(d)]}</b></div>`).join('')}</div><div class="panel"><h2>Datensicherung</h2><div class="row">${button('JSON-Sicherung herunterladen','backup()','primary')}<label class="button">Sicherung einlesen<input type="file" accept="application/json,.json" style="display:none" onchange="restore(event)"></label>${button('Jahresplan CSV','exportYear()')}</div><p class="muted small">Lokale Browserdaten können bei Löschung des Browserverlaufs verloren gehen. Die JSON-Datei ermöglicht die Wiederherstellung auf demselben oder einem anderen Gerät.</p></div>`}
function changeAnchor(v){if(Object.keys(state.locks).length&&!confirm('Kalenderanker ändern? Vorhandene Freigaben passen danach möglicherweise nicht mehr.'))return;state.anchor=v;state.locks={};save()}
function lockBlock(){let r=calculate().blocks.find(b=>b.start===state.selected);if(!r)return;state.locks[r.start]=structuredClone(r);save()}
function unlockBlock(){if(!confirm('Freigabe dieses Blocks wirklich aufheben?'))return;delete state.locks[state.selected];save()}
function download(filename,content,type){let blob=new Blob([content],{type});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
function csv(rows){return '\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n')}
function exportBlock(){let r=calculate().blocks.find(b=>b.start===state.selected);if(!r)return;let rows=[['Mitarbeiter','Grundposition',...r.dates]];for(let p of people)rows.push([p,r.base[p],...r.dates.map(d=>shift(d)==='F'?'Frei':getAbsent(d).includes(p)?'NA':r.daily[d].assign[p]||'')]);download('Anlagenblock_'+r.start+'.csv',csv(rows),'text/csv;charset=utf-8')}
function exportYear(){let rows=[['Datum','Schicht','Stunden','Blockstart',...people]];for(let d='2027-01-01';d<'2027-01-06';d=add(d,1))rows.push([d,'Frei',0,'Vorzyklus',...people.map(()=> 'Frei')]);for(let r of calculate().blocks){for(let d of r.dates){if(!d.startsWith('2027'))continue;rows.push([d,{M:'Früh',N:'Nacht',S:'Spät',F:'Frei'}[shift(d)],hours(d),r.start,...people.map(p=>shift(d)==='F'?'Frei':getAbsent(d).includes(p)?'NA':r.daily[d].assign[p]||'')])}}download('Anlagenplan_2027.csv',csv(rows),'text/csv;charset=utf-8')}
function backup(){download('Anlagenplaner_2027_Sicherung.json',JSON.stringify(state,null,2),'application/json')}
function restore(e){let f=e.target.files[0];if(!f)return;f.text().then(t=>{let data=JSON.parse(t);if(!data.anchor||!Array.isArray(data.priority)||!data.absences||!data.locks)throw Error('Ungültige Sicherungsdatei');if(confirm('Alle aktuellen lokalen Daten durch diese Sicherung ersetzen?')){state=data;save()}}).catch(err=>alert('Import fehlgeschlagen: '+err.message))}
render();
</script></body></html>
